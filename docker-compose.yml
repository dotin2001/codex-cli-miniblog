services:
  api:
    build:
      context: ./apps/api
    container_name: codex_cli_miniblog_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIBLOG_ENV: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: codex_cli_miniblog_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - codex_cli_miniblog_data:/var/lib/mysql

volumes:
  codex_cli_miniblog_data:
